# greetd config for the SM-T550 (gt510-tweaks): log "user" straight into Phosh at boot.
# Same greeter as /etc/phrog/greetd-config.toml; a logout still lands on phrog.
[terminal]
vt = 7

[default_session]
command = "/usr/libexec/phrog-greetd-session"
user = "greetd"

# Runs once per greetd start. greetd sets no session variables here, so pass the ones phrog
# sets on a normal login: without GDMSESSION=phosh, Phosh locks itself at startup and hides
# "Log Out" (phosh_shell_started_by_display_manager).
[initial_session]
command = "env XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=Phosh:GNOME XDG_SESSION_DESKTOP=phosh GDMSESSION=phosh systemd-cat phosh-session"
user = "user"
