# SM-T550 cameras on one CAMSS: the rear SR544 is raw Bayer and needs libcamera's
# soft ISP (GPU debayer); the front SR200PC20 outputs YUV from its own ISP and is
# passed through by the patched libcamera (packages/libcamera 0100).
# The soft ISP output is no longer capped (it was 1296x972 while the 5 MP mode debayered
# at ~0.7 fps; now ~9.5 fps): Snapshot's viewfinder stays small (APERTURE_MAX_HEIGHT in
# gt510-camera.conf) and full-resolution 2584x1944 stills come from a reconfigure on the
# shutter (packages/snapshot 0105, packages/libcamera 0111).
---
version: 1
configuration:
  pipelines:
    simple:
      supported_devices:
        - driver: qcom-camss
          software_isp: true
  # The SR544 binned modes (1296x972, 1280x720) take all four samples of each 2x2 Bayer
  # cell at one spot (measured on raw frames); debayered as ordinary Bayer, red and blue
  # landed ~1 px apart = purple/yellow fringes on every edge. libcamera 0105 reads such
  # inputs as one filtered (R, G, B, G) texel per cell. The 5 MP mode is not co-sited.
  software_isp:
    cosited_max_width: 1296
