<!doctype html>
<meta charset="utf-8">
<title>fsgrad</title>
<!-- ISSUES 23 black triangle: like YouTube's fullscreen player, a container (not the <video>) goes fullscreen; the 16:9
     video is letterboxed (1024x576 at y 96 on the 1024x768 screen) and a bottom gradient overlay covers its lowest
     160 px (YouTube's control-bar gradient). Fullscreen is requested by the page (bench-profile pref). ?nograd drops
     the overlay, ?op=<x> sets its opacity. -->
<style>
html, body { margin: 0; height: 100%; background: #000; }
#p { position: relative; width: 640px; height: 360px; background: #000; overflow: hidden; }
#p:fullscreen { width: 100vw; height: 100vh; }
video { position: absolute; left: 0; width: 100%; height: 100%; object-fit: contain; }
#g { position: absolute; left: 0; right: 0; height: 160px; pointer-events: none;
     background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.8)); }
</style>
<div id="p"><video id="v" src="t1920x1080-100s.mp4" autoplay muted loop></video><div id="g"></div></div>
<script>
const q = new URLSearchParams(location.search), p = document.getElementById("p"), g = document.getElementById("g");
if (q.has("nograd")) g.remove(); else if (q.get("op")) g.style.opacity = q.get("op");
function place() { const h = p.clientWidth * 9 / 16, top = (p.clientHeight - h) / 2; g.style.top = (top + h - 160) + "px"; }
new ResizeObserver(place).observe(p);
document.getElementById("v").addEventListener("playing", () => setTimeout(() => p.requestFullscreen().catch(e => { document.title = "fs-error " + e; }), 2000), { once: true });
</script>
