<!doctype html>
<meta charset="utf-8">
<title>fstest</title>
<!-- Plays a 1080p clip and puts the <video> into DOM fullscreen by itself (needs the bench-profile pref
     full-screen-api.allow-trusted-requests-only=false), like YouTube's fullscreen player: for ISSUES 23's black triangle. -->
<style>html, body { margin: 0; height: 100%; background: #000; } video { width: 100%; height: 100%; object-fit: contain; }</style>
<video id="v" src="t1920x1080-100s.mp4" autoplay muted loop></video>
<script>
const v = document.getElementById("v");
v.addEventListener("playing", () => setTimeout(() => v.requestFullscreen().catch(e => { document.title = "fs-error " + e; }), 2000), { once: true });
</script>
